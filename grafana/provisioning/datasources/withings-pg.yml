apiVersion: 1

datasources:
  - name: Weight
    uid: withings-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: $POSTGRES_USER
    database: withings
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      sslmode: disable
      postgresVersion: 16
    isDefault: false
    editable: true
