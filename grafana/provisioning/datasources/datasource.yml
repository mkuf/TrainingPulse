apiVersion: 1

datasources:
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: db:5432
    user: $POSTGRES_USER
    database: $POSTGRES_DB
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      sslmode: 'disable'
      postgresVersion: 16
    isDefault: true
    editable: true
