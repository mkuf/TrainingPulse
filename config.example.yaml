# TrainingPulse configuration.
#
# Copy to config.yaml and edit. config.yaml is gitignored.
#
# Two environment mechanisms sit on top of this file:
#
#   1. Structural overrides — TP_<SECTION>__<KEY>, e.g.
#        TP_DATA__ACTIVITIES__REFRESH_DAYS=7
#        TP_PROVIDERS__STRAVA__CLIENT_SECRET=abc123
#        TP_DATA__BODY__PRECEDENCE=withings        (lists are comma-separated)
#      An override always beats the value in this file.
#
#   2. Value interpolation — ${VAR} or ${VAR:-default} inside a value here,
#      expanded from the environment before validation. Use this to keep
#      secrets out of the file (Docker secrets, CI injection). An unset ${VAR}
#      with no default becomes an empty string and logs a warning.
#
# Unknown keys, wrong types, and missing required values abort startup with
# every problem listed at once.

app:
  base_url: http://localhost:8000
  # Where the status page links to Grafana. Leave empty to use base_url's host
  # on port 3000.
  grafana_url: ""
  # DEBUG | INFO | WARNING | ERROR | CRITICAL
  log_level: INFO

database:
  # Docker Compose sets TP_DATABASE__URL from the POSTGRES_* values in .env,
  # which the db and grafana containers also need. Leave this alone unless you
  # run the app outside Compose.
  url: postgresql+asyncpg://trainingpulse:changeme@db:5432/trainingpulse

# REQUIRED. These are the only source of heart-rate zones and FTP: no provider
# is asked for a profile. Zones are computed from max_hr. rest_hr is a
# fallback: an imported resting heart rate (7-day median) replaces it.
# Getting these wrong silently distorts TRIMP and therefore CTL/ATL/TSB for
# your entire history, which is why there are no defaults.
athlete:
  max_hr: 190
  rest_hr: 60
  ftp: 250
  # Optional. Body weight for calorie estimates of activities whose source
  # reports none. Imported weigh-ins (e.g. Withings) take precedence.
  # weight_kg: 75
  # Assigns weigh-ins to calendar days, which is how body measurements from
  # several providers are deduplicated. Any IANA zone name.
  timezone: UTC
  # Hours of sleep that earn full marks for duration in the sleep score.
  # sleep_need_hours: 8

# ── Accounts ─────────────────────────────────────────────────────────
#
# One block per service you connect. `imports` picks which data kinds to take
# from it; omit it to take everything the provider supports. Listing a kind a
# provider cannot supply is a startup error that says what it can supply.
#
#   provider        can supply
#   icu             activities
#   strava          activities
#   google_health   activities, sleep, wellness, intraday
#   hammerhead      activities
#   garmin          activities, body, sleep, wellness, intraday
#   withings        body
#   fddb            nutrition

providers:
  # intervals.icu — API key from https://intervals.icu/settings
  icu:
    enabled: true
    api_key: ${INTERVALS_ICU_API_KEY}
    api_base: https://intervals.icu/api/v1

  # Strava — create an app at https://www.strava.com/settings/api and set the
  # Authorization Callback Domain to your app.base_url host. The full callback
  # URL is {app.base_url}/auth/strava/callback
  #
  # Strava's default read budget is 100 requests per 15 minutes and 1000 per
  # day, roughly twenty times tighter than intervals.icu. A full history
  # backfill with streams can take days; it resumes automatically.
  strava:
    enabled: false
    client_id: ""
    client_secret: ${STRAVA_CLIENT_SECRET:-}

  # Google Health — OAuth client from Google Cloud Console. The redirect URI
  # must be exactly {app.base_url}/auth/google/callback
  #
  # Connecting asks only for the scopes of the imported kinds; sleep needs its
  # own scope. After adding a kind to `imports`, reconnect from the status page.
  google_health:
    enabled: false
    client_id: ""
    client_secret: ${GOOGLE_HEALTH_CLIENT_SECRET:-}
    api_base: https://health.googleapis.com/v4

  # Hammerhead (Karoo bike computers) — create an API client via
  # https://support.hammerhead.io/hc/en-us/sections/42738685226523-Public-API
  # and set its redirect URI to exactly {app.base_url}/auth/hammerhead/callback
  #
  # Hammerhead's list/detail JSON carries no heart rate, power, cadence, or
  # elevation data — only its .fit file does, so every activity downloads and
  # permanently stores one (see app/fitfiles/). Hammerhead publishes no
  # documented rate-limit budget.
  hammerhead:
    enabled: false
    client_id: ""
    client_secret: ${HAMMERHEAD_CLIENT_SECRET:-}
    api_base: https://api.hammerhead.io/v1/api

  # Garmin Connect — Personal API key from Garmin Connect (web) → Settings →
  # Personal API → Create Key. No OAuth and no redirect URI. Keys expire after
  # 30 days to one year; Garmin emails a week before. Activities download and
  # permanently store the original .fit file, like Hammerhead. Garmin
  # publishes no rate-limit budget.
  garmin:
    enabled: false
    api_key: ${GARMIN_PERSONAL_API_KEY:-}
    api_base: https://personal.connectapi.garmin.com

  # Withings — body weight, fat %, and muscle mass from Withings scales.
  # Create an app in the Withings Partner Hub; its callback URL must be
  # {app.base_url}/plugins/withings/get_token (unchanged from earlier releases).
  withings:
    enabled: false
    client_id: ""
    client_secret: ${WITHINGS_CLIENT_SECRET:-}
    # Blank uses the callback above. Set it only if Withings must reach the
    # app on a different URL than app.base_url.
    redirect_uri: ""

  # FDDB — daily nutrition scraped from fddb.info. `cookie` is the value of the
  # `fddb` session cookie (browser devtools → Network → any fddb.info
  # request), without the `fddb=` prefix.
  fddb:
    enabled: false
    user: ""
    password: ${FDDB_PW:-}
    cookie: ${FDDB_COOKIE:-}
    base_url: https://fddb.info
    lang: de
    # Pause between scraped diary pages.
    request_delay_ms: 300

# ── What to keep, and who wins a duplicate ───────────────────────────
#
# Every provider's rows are stored; precedence decides which are visible.
# Activities compete when their time ranges overlap. Every other kind
# competes per calendar day: the highest-ranked provider with any data that
# day wins the whole day, so nothing is double-counted. A night belongs to the
# day it ends. Only the winning activity spends detail and stream API calls.
#
# Precedence ignores `enabled`, so disabling a provider keeps its history
# ranked where it was. Providers that can supply a kind but are left out of
# its list rank last.
#
#   history_days  how far back the first sync of a provider lists
#   refresh_days  how far back every later sync re-lists to pick up upstream
#                 edits; 0 turns re-listing off

data:
  activities:
    precedence: [icu, strava, google_health, hammerhead, garmin]
    history_days: 3650
    refresh_days: 90
  body:
    precedence: [withings, garmin]
    history_days: 3650
    refresh_days: 7
  nutrition:
    precedence: [fddb]
    history_days: 365
    refresh_days: 7
  # One main sleep per night: times, stage totals and timeline, naps.
  sleep:
    precedence: [garmin, google_health]
    history_days: 3650
    refresh_days: 7
  # Daily recovery values: resting heart rate, HRV, respiration, SpO2, skin
  # temperature deviation, steps, calories. An imported resting heart rate
  # replaces athlete.rest_hr (median of the last 7 days).
  wellness:
    precedence: [garmin, google_health]
    history_days: 3650
    refresh_days: 7
  # Heart rate (two-minute averages), HRV (every 5 min asleep), and SpO2
  # samples. Garmin needs two requests per day, so the default history is
  # short; raise history_days for a longer backfill.
  intraday:
    precedence: [garmin, google_health]
    history_days: 30
    refresh_days: 1

sync:
  interval_minutes: 15
  # Chunk size for backfill and refresh listing.
  window_days: 90
  detail_concurrency: 5
  streams_concurrency: 5

mcp:
  host: 0.0.0.0
  # Must match the container port published in docker-compose.yml.
  port: 8001
  allowed_hosts:
    - "localhost:*"
    - "127.0.0.1:*"
