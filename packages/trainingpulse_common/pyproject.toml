[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trainingpulse-common"
version = "0.1.0"
description = "Shared configuration, catalog, and database helpers for TrainingPulse"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.40",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["trainingpulse_common*"]
