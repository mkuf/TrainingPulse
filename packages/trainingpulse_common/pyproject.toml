[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trainingpulse-common"
version = "0.1.0"
description = "Shared utilities for TrainingPulse core and plugins"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.40",
    "fastapi>=0.115",
    "apscheduler>=3.11",
    "mcp>=1.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["trainingpulse_common*"]
