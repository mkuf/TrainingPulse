# Runs the unit and integration tests, then builds the runtime image, starts it
# against Postgres (smoke test), and pushes it to ghcr.io/<owner>/trainingpulse.
# A push to main updates `latest`; a tag updates `latest` and adds the tag. A
# pull request builds and smoke-tests without pushing.
name: image

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  # Superseded pull request runs are dropped; pushes always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose run --rm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Built into the local image store first, so the smoke test runs the
      # exact image that is pushed below (the push reuses the cached layers).
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: app/Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          tags: trainingpulse:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: .github/smoke/smoke-test.sh trainingpulse:smoke

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # ghcr needs a lowercase name.
          images: ghcr.io/${{ github.repository_owner }}/trainingpulse
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: app/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
