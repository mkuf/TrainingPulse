# Builds the runtime image and pushes it to ghcr.io/<owner>/trainingpulse.
# A push to main updates `latest`; a tag updates `latest` and adds the tag.
name: image

on:
  push:
    branches: [main]
    tags: ["*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # ghcr needs a lowercase name.
          images: ghcr.io/${{ github.repository_owner }}/trainingpulse
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
