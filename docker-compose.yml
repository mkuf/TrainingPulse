services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trainingpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-trainingpulse}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trainingpulse} -d ${POSTGRES_DB:-trainingpulse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # All application configuration lives here. See config.example.yaml.
      - ./config.yaml:/config/config.yaml:ro
    environment:
      TP_CONFIG_FILE: /config/config.yaml
      # The db and grafana containers need POSTGRES_* as environment variables,
      # so the connection string is composed here rather than duplicated in
      # config.yaml. Any TP_*__* variable overrides the file.
      TP_DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-trainingpulse}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-trainingpulse}
    depends_on:
      db:
        condition: service_healthy

  mcp:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "mcp_server"]
    ports:
      # The container always listens on mcp.port (8001); only the host port is
      # configurable here.
      - "${MCP_PORT:-8001}:8001"
    volumes:
      # Shares the app's config file. To keep provider credentials out of this
      # container, point TP_CONFIG_FILE at a reduced file instead — the MCP
      # server only needs athlete.*, mcp.*, and database.url.
      - ./config.yaml:/config/config.yaml:ro
    environment:
      TP_CONFIG_FILE: /config/config.yaml
      TP_DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-trainingpulse}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-trainingpulse}
      TP_MCP__PORT: 8001
    depends_on:
      db:
        condition: service_healthy

  test:
    # Not started by `docker compose up`; run with `docker compose run --rm test`.
    profiles: ["test"]
    build:
      context: .
      dockerfile: app/Dockerfile
      target: test
    volumes:
      - ./:/repo:ro
    working_dir: /repo/app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"

  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_BASIC_ENABLED=false
      - POSTGRES_USER=${POSTGRES_USER:-trainingpulse}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-trainingpulse}
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      # Kept outside the provisioning directory, and split into core/ and
      # addons/, so each dashboard is picked up by exactly one provider.
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
